<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you | RunTime Recruitment</title>
  <meta name="description" content="Thank you for buying the firmware CV guide.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Raleway:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #e83527;
      --ink: #111111;
      --muted: #5f6268;
      --line: #e5e5e5;
      --surface: #ffffff;
      --max: 680px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--surface);
      color: var(--ink);
      font-family: "DM Sans", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--surface);
    }

    .site-header {
      border-bottom: 1px solid var(--line);
    }

    .nav,
    main,
    .footer-inner {
      width: min(var(--max), calc(100% - 40px));
      margin: 0 auto;
    }

    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
    }

    .logo {
      font-family: "Raleway", Arial, sans-serif;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .logo span {
      color: var(--accent);
    }

    main {
      min-height: calc(100vh - 170px);
      padding: 86px 0;
    }

    h1 {
      max-width: 10ch;
      margin: 0;
      font-family: "Raleway", Arial, sans-serif;
      font-size: clamp(3rem, 11vw, 5.2rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      max-width: 520px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(1.2rem, 3.4vw, 1.6rem);
      font-weight: 700;
      line-height: 1.35;
    }

    .site-footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
    }

    .footer-inner {
      padding: 28px 0 34px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <div class="logo">RunTime<span>Recruitment</span></div>
    </nav>
  </header>

  <main>
    <h1>Thank you.</h1>
    <p>Thank you for your purchase. Check your email for your personalised download link. It expires in 24 hours.</p>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">Copyright RunTime Recruitment 2026</div>
  </footer>
</body>
</html>
